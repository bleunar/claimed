name: claimed

services:
  claimed_backend:
    build: ./backend
    container_name: claimed_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    secrets:
      - mysql_password
      - secret_key
      - mysql_host
      - mysql_user
      - mysql_db
    environment:
      - MYSQL_HOST_FILE=/run/secrets/mysql_host
      - MYSQL_USER_FILE=/run/secrets/mysql_user
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_DB_FILE=/run/secrets/mysql_db
      - SECRET_KEY_FILE=/run/secrets/secret_key
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - upload_data:/app/uploads
      - ./backend_logs:/app/logs
    networks:
      - claimed
      - production

  claimed_frontend:
    build: ./frontend
    container_name: claimed_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - PROXY_TARGET=${PROXY_TARGET:-http://claimed_backend:5000}
    depends_on:
      - claimed_backend
    networks:
      - claimed
      - production

networks:
  claimed:
    name: claimed
    driver: bridge
  production:
    external: true

volumes:
  upload_data:

secrets:
  secret_key:
    file: ./secrets/.secret_key
  jwt_secret_key:
    file: ./secrets/.jwt_secret_key
  mysql_host:
    file: ./secrets/.mysql_host
  mysql_db:
    file: ./secrets/.mysql_db
  mysql_user:
    file: ./secrets/.mysql_user
  mysql_password:
    file: ./secrets/.mysql_password
  mail_server:
    file: ./secrets/.mail_server
  mail_server_port:
    file: ./secrets/.mail_server_port
  mail_username:
    file: ./secrets/.mail_username
  mail_password:
    file: ./secrets/.mail_password
  default_admin_email:
    file: ./secrets/.default_admin_email
  default_admin_password:
    file: ./secrets/.default_admin_password
